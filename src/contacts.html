<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href= "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
  <div class="container-fluid">
      <div class="row">
        <nav class="col-2 bg-dark text-white vh-100 p-3">
          <i class="bi bi-bootstrap" width="30" height="24" class="d-inline-block align-text-top bg-white"></i> Меню
          <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link text-white" href="index.html">
              <i class="bi bi-house" width="30" height="24" class="d-inline-block align-text-top bg-white"></i> Главная</a></li>
            <li class="nav-item"><a class="nav-link text-white active" href="catalog.html">
              <i class="bi bi-card-list" width="30" height="24" class="d-inline-block align-text-top bg-white"></i> Каталог</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="category.html">
              <i class="bi bi-basket2" width="30" height="24" class="d-inline-block align-text-top bg-white"></i> Заказы</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="contacts.html">
              <i class="bi bi-person-circle" width="30" height="24" class="d-inline-block align-text-top bg-white"></i> Контакты</a></li>
            <div class="fixed-bottom">
              <div class="dropdown">
                <a class="btn btn-secondary dropdown-toggle" href="#" role="button" id="dropdownMenuLink" data-bs-toggle="dropdown" aria-expanded="false">
                  Пользователь
                </a>

                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">Профиль</a></li>
                  <li><a class="dropdown-item" href="#">Выход</a></li>
                </ul>
              </div>
            </div>
          </ul>
        </nav>
<main class="col-10 p-5">
          <h1 class="mb-4 text-center">Контакты</h1>
          <div class="row">
            <div class="col-md-6">
              <form method="post" action="/">
                <div class="mb-3">
                  <label for="name" class="form-label">Имя</label>
                  <input type="text" class="form-control" id="name" name="name" placeholder="Ваше имя">
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Почта</label>
                  <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com">
                </div>
                <div class="mb-3">
                  <label for="message" class="form-label">Сообщение</label>
                  <textarea class="form-control" id="message" name="message" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Отправить</button>
              </form>
            </div>
            <div class="col-md-6">
              <h3>Наши контакты</h3>
              <p>Этот текст служит заполнителем: здесь будет информация о контактах компании. Вы можете написать адрес, телефон или любое другое описание.</p>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
